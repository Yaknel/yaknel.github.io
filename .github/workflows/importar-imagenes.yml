name: Importar imágenes de yaknel.com

# Descarga las fotos listadas en assets/imagenes-urls.txt, las optimiza
# (máx. 1600 px, JPEG calidad 80) y las guarda en public/images/.
# Se ejecuta al cambiar la lista o a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
    paths:
      - assets/imagenes-urls.txt
      - .github/workflows/importar-imagenes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y optimizar fotos
        run: |
          sudo apt-get install -y -qq imagemagick >/dev/null
          mkdir -p public/images /tmp/raw
          # Solo fotos (jpg/jpeg); se omiten logos, capturas y placeholders
          grep -Ei '\.(jpe?g)$' assets/imagenes-urls.txt \
            | grep -viE 'logo|screenshot|placeholder|elementor' > /tmp/urls.txt
          wget -q -nc -P /tmp/raw -i /tmp/urls.txt || true
          for f in /tmp/raw/*; do
            name=$(basename "$f" | sed -E 's/-scaled//; s/\.(jpe?g)$//I' | tr 'A-Z' 'a-z')
            out="public/images/${name}.jpg"
            [ -f "$out" ] && continue
            convert "$f" -auto-orient -resize '1600x1600>' -strip -quality 80 "$out" || true
          done
          ls public/images | wc -l
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/images
          git diff --cached --quiet || git commit -m "Importar fotos de yaknel.com a public/images"
          git push
